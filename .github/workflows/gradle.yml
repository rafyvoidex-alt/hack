
name: Build MiD Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
          cache-provider: basic

      - name: Extract project
        id: project
        shell: bash
        run: |
          unzip -q MiD-Client-26.3.zip -d source

          BUILD_FILE=$(find source -name build.gradle -type f -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          # Fix the original Fabric dependency configuration
          sed -i 's/modImplementation[[:space:]]\+/implementation /g' "$BUILD_FILE"

          echo "path=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Minecraft mod
        run: gradle build --no-daemon
        working-directory: ${{ steps.project.outputs.path }}

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MiD-Client-26.3
          path: ${{ steps.project.outputs.path }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
